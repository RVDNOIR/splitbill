<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Bill & Rekap - Minimalist & Modern</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            900: '#2B32A8', /* Dark Blue */
                            700: '#2774A6', /* Medium Blue */
                            500: '#49A7C1', /* Light Blue */
                            300: '#0DE2B4', /* Turquoise */
                        }
                    },
                    animation: {
                        'float': 'float 8s ease-in-out infinite',
                        'float-delayed': 'float 8s ease-in-out 4s infinite',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0) scale(1)' },
                            '50%': { transform: 'translateY(-20px) scale(1.05)' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen relative overflow-x-hidden selection:bg-brand-500 selection:text-white pb-20">

    <!-- Auth Section (Login/Logout) -->
    <div class="fixed top-4 right-4 z-50">
        <div id="loggedOutView">
            <button id="btnLogin" class="glass-card px-5 py-2.5 rounded-xl font-bold text-brand-900 border border-white/60 hover:bg-white/90 shadow-sm transition-all flex items-center gap-2 active:scale-95">
                <i class="fa-brands fa-google text-red-500"></i> Login Google
            </button>
        </div>
        <div id="loggedInView" class="hidden glass-card px-4 py-2 rounded-xl border border-white/60 shadow-sm flex items-center gap-3">
            <img id="userPhoto" src="" alt="User" class="w-9 h-9 rounded-full border-2 border-brand-500 shadow-sm">
            <div class="text-sm">
                <p id="userName" class="font-bold text-slate-800 leading-tight"></p>
                <button id="btnLogout" class="text-xs text-red-500 font-semibold hover:underline mt-0.5">Logout</button>
            </div>
        </div>
    </div>

    <!-- Background Ambient Gradients -->
    <div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] bg-brand-900/15 rounded-full blur-[120px] -z-10 mix-blend-multiply animate-float"></div>
    <div class="fixed top-[20%] right-[-10%] w-[40%] h-[40%] bg-brand-500/15 rounded-full blur-[100px] -z-10 mix-blend-multiply animate-float-delayed"></div>
    <div class="fixed bottom-[-15%] left-[15%] w-[60%] h-[60%] bg-brand-300/15 rounded-full blur-[140px] -z-10 mix-blend-multiply animate-float"></div>

    <main class="container mx-auto px-4 py-12 max-w-2xl min-h-screen flex flex-col items-center animate-slide-up">
        
        <!-- Header -->
        <header class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-brand-900 via-brand-700 to-brand-500 text-white shadow-xl shadow-brand-500/30 mb-6 transform hover:scale-110 transition-transform duration-300">
                <i class="fa-solid fa-file-invoice-dollar text-2xl"></i>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 mb-2">Split the Bill</h1>
            <p class="text-slate-500 font-medium">Hitung patungan & rekap pengeluaran bulananmu.</p>
        </header>

        <!-- Main Glass Card -->
        <div class="w-full glass-card rounded-[2rem] p-8 sm:p-10 shadow-[0_8px_30px_rgb(0,0,0,0.04)] relative overflow-hidden border border-white/60 transition-all duration-300 hover:shadow-[0_8px_40px_rgba(73,167,193,0.15)] mb-12">
            
            <form id="splitBillForm" class="space-y-8">
                <!-- Event Name -->
                <div class="space-y-2 group">
                    <label for="eventName" class="block text-sm font-semibold text-slate-700 transition-colors group-focus-within:text-brand-900">Nama Pengeluaran / Acara</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-5 text-brand-700 text-lg opacity-70"><i class="fa-solid fa-pen"></i></span>
                        <input type="text" id="eventName" placeholder="Cth: Makan di McD, Nonton bareng..." class="w-full pl-14 pr-5 py-4 rounded-2xl border-2 border-slate-100 bg-white/60 backdrop-blur-sm focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none transition-all font-semibold text-lg text-slate-800 shadow-inner" required>
                    </div>
                </div>

                <!-- Total Amount -->
                <div class="space-y-2 group">
                    <label for="totalAmount" class="block text-sm font-semibold text-slate-700 transition-colors group-focus-within:text-brand-900">Total Tagihan (Rupiah)</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-5 text-brand-700 font-bold text-lg">Rp</span>
                        <input type="number" id="totalAmount" placeholder="0" class="w-full pl-14 pr-5 py-4 rounded-2xl border-2 border-slate-100 bg-white/60 backdrop-blur-sm focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none transition-all font-bold text-2xl text-slate-800 shadow-inner" required min="1" step="1">
                    </div>
                </div>

                <!-- Number of People -->
                <div class="space-y-2 group">
                    <label class="block text-sm font-semibold text-slate-700 transition-colors group-focus-within:text-brand-900">Dibagi Berapa Orang?</label>
                    <div class="flex items-center justify-between gap-4 bg-white/60 border-2 border-slate-100 rounded-2xl p-2 shadow-inner focus-within:border-brand-500 focus-within:ring-4 focus-within:ring-brand-500/10 transition-all">
                        <button type="button" id="btnMinusPerson" class="w-12 h-12 rounded-xl bg-white text-slate-500 hover:bg-slate-50 hover:text-brand-900 shadow-sm transition-all active:scale-90 flex items-center justify-center text-lg">
                            <i class="fa-solid fa-minus"></i>
                        </button>
                        
                        <div class="flex-1 relative text-center">
                            <input type="number" id="numPeople" value="2" min="1" max="100" class="w-full text-center bg-transparent outline-none font-bold text-2xl text-slate-800">
                        </div>

                        <button type="button" id="btnPlusPerson" class="w-12 h-12 rounded-xl bg-white text-slate-500 hover:bg-slate-50 hover:text-brand-900 shadow-sm transition-all active:scale-90 flex items-center justify-center text-lg">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>

                <!-- Tip Percentage -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="block text-sm font-semibold text-slate-700">Persentase Tip</label>
                    </div>
                    <div class="grid grid-cols-4 gap-3">
                        <button type="button" class="tip-btn active-tip py-3 rounded-2xl border-2 border-slate-100 font-bold text-slate-600 transition-all shadow-sm hover:border-brand-300 bg-white/60 backdrop-blur-sm" data-tip="0">0%</button>
                        <button type="button" class="tip-btn py-3 rounded-2xl border-2 border-slate-100 font-bold text-slate-600 transition-all shadow-sm hover:border-brand-300 bg-white/60 backdrop-blur-sm" data-tip="10">10%</button>
                        <button type="button" class="tip-btn py-3 rounded-2xl border-2 border-slate-100 font-bold text-slate-600 transition-all shadow-sm hover:border-brand-300 bg-white/60 backdrop-blur-sm" data-tip="15">15%</button>
                        <button type="button" class="tip-btn py-3 rounded-2xl border-2 border-slate-100 font-bold text-slate-600 transition-all shadow-sm hover:border-brand-300 bg-white/60 backdrop-blur-sm" data-tip="20">20%</button>
                    </div>
                </div>

                <!-- Action Button -->
                <button type="submit" id="calculateBtn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-brand-900 via-brand-700 to-brand-500 text-white font-bold text-lg shadow-[0_10px_25px_rgba(39,116,166,0.4)] hover:shadow-[0_15px_35px_rgba(39,116,166,0.6)] transform hover:-translate-y-1 transition-all duration-300 active:scale-[0.98] relative overflow-hidden group mt-4">
                    <span class="relative z-10 flex justify-center items-center gap-2">
                        Hitung Pembagian <i class="fa-solid fa-arrow-right opacity-0 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>
                    </span>
                    <div class="absolute inset-0 h-full w-full bg-gradient-to-r from-brand-500 to-brand-300 opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-0"></div>
                </button>
            </form>

            <!-- Results Section -->
            <div id="resultSection" class="hidden mt-6 pt-8 border-t border-slate-200/60 animate-fade-in">
                <div class="text-center mb-8">
                    <p class="text-sm font-semibold text-brand-700 uppercase tracking-wider mb-2">Per Orang Bayar</p>
                    <div class="text-4xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-brand-900 via-brand-700 to-brand-500 drop-shadow-sm break-all">
                        <span id="perPersonAmount">Rp0</span>
                    </div>
                </div>

                <div class="bg-white/50 rounded-2xl p-5 space-y-4 backdrop-blur-md border border-white/60 shadow-sm">
                    <div class="flex justify-between items-center text-sm font-medium text-slate-600">
                        <span>Tagihan Dasar</span>
                        <span id="summaryBaseBill" class="font-bold text-slate-800">Rp0</span>
                    </div>
                    <div class="flex justify-between items-center text-sm font-medium text-slate-600">
                        <span>Total Tip</span>
                        <span id="summaryTip" class="font-bold text-slate-800">Rp0</span>
                    </div>
                    <div class="h-px w-full bg-slate-200/80"></div>
                    <div class="flex justify-between items-center text-sm font-extrabold text-brand-900">
                        <span>Total Keseluruhan</span>
                        <span id="summaryTotal" class="text-lg">Rp0</span>
                    </div>
                </div>
                
                <div class="mt-6 flex flex-col gap-3">
                    <button id="btnSaveToDB" class="w-full py-4 rounded-2xl bg-brand-500 text-white font-bold text-lg shadow-md hover:bg-brand-700 hover:shadow-lg transition-all active:scale-[0.98] flex justify-center items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Simpan ke Cloud Database
                    </button>
                    <button id="btnReset" class="w-full py-3 rounded-2xl bg-white border-2 border-slate-200 text-slate-600 font-bold hover:bg-slate-50 hover:text-brand-900 hover:border-brand-300 transition-all active:scale-[0.98] flex justify-center items-center gap-2">
                        <i class="fa-solid fa-rotate-left"></i> Hitung Ulang
                    </button>
                </div>
            </div>
        </div>

        <!-- Recap Database Section -->
        <div class="w-full">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-2xl font-extrabold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-database text-brand-500"></i> Rekap Database
                </h2>
                <div class="relative">
                    <select id="filterMonthYear" class="appearance-none bg-white border-2 border-slate-200 rounded-xl pl-4 pr-10 py-2 font-bold text-slate-700 focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none shadow-sm cursor-pointer min-w-[160px]">
                        <!-- Options generated by JS -->
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                </div>
            </div>
            
            <div class="space-y-4" id="recapList">
                <!-- List items rendered via JS -->
            </div>

            <!-- Empty state -->
            <div id="emptyState" class="hidden text-center py-10 glass-card rounded-[2rem] border border-white/60 shadow-sm">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 text-slate-300 mb-4">
                    <i class="fa-solid fa-box-open text-3xl"></i>
                </div>
                <p class="text-slate-500 font-medium">Belum ada data rekap di bulan ini.</p>
            </div>

            <!-- Total Recap Summary -->
            <div id="recapSummaryCard" class="mt-6 p-6 bg-gradient-to-r from-brand-900 via-brand-700 to-brand-500 rounded-2xl text-white flex flex-col sm:flex-row justify-between items-center shadow-[0_10px_25px_rgba(39,116,166,0.3)] transform transition-all hover:-translate-y-1 hidden">
                <div class="flex items-center gap-4 mb-2 sm:mb-0">
                    <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm">
                        <i class="fa-solid fa-chart-pie text-xl text-white"></i>
                    </div>
                    <span class="font-medium text-brand-100 text-lg">Total Pengeluaran</span>
                </div>
                <span class="text-3xl font-extrabold tracking-tight" id="totalRecapAmount">Rp0</span>
            </div>
        </div>
        
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-white border-l-4 border-brand-300 shadow-xl rounded-xl p-4 flex items-center gap-3 z-50">
        <div class="w-8 h-8 rounded-full bg-brand-300/20 text-brand-300 flex items-center justify-center">
            <i class="fa-solid fa-check"></i>
        </div>
        <p id="toastMessage" class="font-semibold text-slate-700">Berhasil disimpan!</p>
    </div>

    <!-- Firebase SDKs (Compat versions for local file:// access) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="app.js"></script>
</body>
</html>
